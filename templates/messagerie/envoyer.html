{% extends 'base.html' %}
{% block title %}Nouveau message{% endblock %}
{% block page_title %}Nouveau Message{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card p-4">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Destinataire *</label>
                    {{ form.destinataire }}
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Message *</label>
                    {{ form.contenu }}
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success px-4">
                        <i class="bi bi-send me-1"></i>Envoyer
                    </button>
                    <a href="{% url 'messagerie:inbox' %}"
                       class="btn btn-outline-secondary">
                        Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
