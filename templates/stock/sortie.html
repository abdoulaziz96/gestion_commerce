{% extends 'base.html' %}
{% block title %}Sortie stock{% endblock %}
{% block page_title %}Sortie de Stock{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <div class="alert alert-warning py-2 mb-3">
                <i class="bi bi-dash-circle me-2"></i>
                Enregistrer une perte, casse ou ajustement négatif.
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Produit *</label>
                    {{ form.produit }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Quantité retirée *</label>
                    {{ form.quantite }}
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Motif *</label>
                    {{ form.motif }}
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning px-4">
                        <i class="bi bi-dash-circle me-1"></i>Enregistrer la sortie
                    </button>
                    <a href="{% url 'stock:liste' %}" class="btn btn-outline-secondary">
                        Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
